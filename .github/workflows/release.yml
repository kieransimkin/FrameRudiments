name: Release FrameRudiments
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag to release
        required: true
        type: string
      publish_pypi:
        description: Publish the same verified distributions to PyPI
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: framerudiments-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate tag and main ancestry
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert os.environ['TAG']=='v'+version
          subprocess.run(['git','merge-base','--is-ancestor','HEAD','origin/main'],check=True)
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Render regression suite
        env:
          FRAMERUDIMENTS_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          FRAMERUDIMENTS_FFMPEG: /usr/bin/ffmpeg
        run: |
          python -m pytest -q --junitxml=test-results.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('test-results.xml'); assert not r.findall('.//skipped')"
      - run: python -m build && python -m twine check --strict dist/*
      - name: Clean wheel install and encoded smoke test
        run: |
          python -m venv /tmp/framerudiments-wheel
          /tmp/framerudiments-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/framerudiments-wheel/bin/python -I -m framerudiments demo /tmp/framerudiments-demo --rudiments --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          /tmp/framerudiments-wheel/bin/python -I -m framerudiments render /tmp/framerudiments-demo/project.json --output /tmp/framerudiments-smoke --ffmpeg /usr/bin/ffmpeg --preset veryfast
      - name: Checksums and source identity
        run: |
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cd dist
          sha256sum *.whl *.tar.gz SOURCE_COMMIT.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist && sha256sum -c SHA256SUMS.txt && cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$TAG" --dir existing
            cd existing && sha256sum -c SHA256SUMS.txt && cd ..
            test "$(cat existing/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
            echo 'Existing matching release verified; preserving all assets'
          else
            gh release create "$TAG" dist/* --verify-tag --title "FrameRudiments $TAG" --notes-file RELEASE_NOTES.md
          fi
  pypi:
    needs: github-release
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Download the exact published GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir verified
          gh release download "$TAG" --dir verified
          cd verified && sha256sum -c SHA256SUMS.txt && cd ..
          test "$(cat verified/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
          mkdir dist && cp verified/*.whl verified/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
