name: Effect graph GPU matte and chroma parity

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: 'Include 4K and 8K GPU benchmarks (high resource use)'
        type: boolean
        default: false
  push:
    paths:
      - 'src/framerudiments/effect_graph*'
      - 'tests/test_effect_graph_gpu*'
      - 'integration/benchmark_effect_graph_gpu.py'
      - 'integration/benchmark_effect_graph_spectral_gpu.py'
      - 'integration/benchmark_effect_graph_m8_5_gpu.py'
      - 'integration/benchmark_effect_graph_m8_6_gpu.py'
      - 'integration/benchmark_effect_graph_m8_7_gpu.py'
      - 'integration/benchmark_effect_graph_m8_9_gpu.py'
      - 'integration/benchmark_effect_graph_m8_9_precision.py'
      - 'integration/benchmark_effect_graph_m8_9_resources.py'
      - '.github/workflows/effect-graph-gpu.yml'
  pull_request:
    paths:
      - 'src/framerudiments/effect_graph*'
      - 'tests/test_effect_graph_gpu*'
      - 'integration/benchmark_effect_graph_gpu.py'
      - 'integration/benchmark_effect_graph_spectral_gpu.py'
      - 'integration/benchmark_effect_graph_m8_5_gpu.py'
      - 'integration/benchmark_effect_graph_m8_6_gpu.py'
      - 'integration/benchmark_effect_graph_m8_7_gpu.py'
      - 'integration/benchmark_effect_graph_m8_9_gpu.py'
      - 'integration/benchmark_effect_graph_m8_9_precision.py'
      - 'integration/benchmark_effect_graph_m8_9_resources.py'
      - '.github/workflows/effect-graph-gpu.yml'

jobs:
  cpu-gpu-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '3.3'
      FRAMERUDIMENTS_GPU_BACKEND: 'egl'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software OpenGL/EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Install dependencies
        run: python -m pip install -e '.[gpu,dev]'
      - name: Require functioning ModernGL/EGL context (no skip-only pass)
        run: |
          python - <<'PY'
          from framerudiments.effect_graph_gpu import GLMatteBackend
          with GLMatteBackend(backend='egl') as gpu:
              print('GPU renderer:', gpu.capabilities.renderer)
              print('OpenGL version:', gpu.capabilities.context_version)
          PY
      - name: Run real GPU-versus-CPU parity tests
        run: >-
          python -m pytest -q
          tests/test_effect_graph_gpu_parity.py tests/test_effect_graph_gpu_dispatch.py
          tests/test_effect_graph_gpu_resources.py tests/test_effect_graph_gpu_spectral.py
          tests/test_effect_graph_gpu_spectral_dispatch.py tests/test_effect_graph_gpu_transport.py
          tests/test_effect_graph_gpu_kernels.py tests/test_effect_graph_gpu_resident_egl.py
          tests/test_effect_graph_gpu_resident_m86_egl.py tests/test_effect_graph_gpu_resident_m87_egl.py
          tests/test_effect_graph_gpu_spatial_egl.py --junitxml=gpu-transfer-results.xml
      - name: Require real GPU transport and parity tests with no skips
        run: |
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET
          root = ET.parse('gpu-transfer-results.xml').getroot()
          tests = root.findall('.//testcase')
          if not tests:
              raise SystemExit('No real GPU tests executed')
          if root.findall('.//skipped') or root.findall('.//failure') or root.findall('.//error'):
              raise SystemExit('GPU parity cannot pass with skipped/failed tests')
          transport = [t for t in tests if 'test_effect_graph_gpu_transport' in t.attrib.get('classname', '')]
          if len(transport) < 2:
              raise SystemExit('M8.2 real GPU transport tests were not collected')
          kernels = [t for t in tests if 'test_effect_graph_gpu_kernels' in t.attrib.get('classname', '')]
          if len(kernels) < 15:
              raise SystemExit('M8.3 shader parity cases were not collected')
          resident = [t for t in tests if 'test_effect_graph_gpu_resident_egl' in t.attrib.get('classname','')]
          if len(resident) < 4:
              raise SystemExit('M8.5 resident shader parity/budget checks were not collected')
          spectral = [t for t in tests if 'test_effect_graph_gpu_resident_m86_egl' in t.attrib.get('classname','')]
          if len(spectral) < 9:
              raise SystemExit('M8.6 real resident spectral parity, budgets and recovery were not collected')
          matte = [t for t in tests if 'test_effect_graph_gpu_resident_m87_egl' in t.attrib.get('classname', '')]
          if len(matte) < 16:
              raise SystemExit('M8.7/M8.8 matte, decontamination and mixed-island tests were not collected')
          spatial = [t for t in tests if 'test_effect_graph_gpu_spatial_egl' in t.attrib.get('classname', '')]
          if len(spatial) < 40:
              raise SystemExit('M8.9 spatial warp shader parity and lineage cases were not collected')
          print(f'{len(tests)} GPU tests, {len(transport)} M8.2 transfers, {len(kernels)} M8.3 kernels; none skipped')
          PYTEST
      - name: Benchmark spectral HD GPU and CPU (end-to-end)
        run: |
          python integration/benchmark_effect_graph_spectral_gpu.py --size hd --backend egl --cpu --repeats 2 --output spectral-gpu-benchmark-hd.json
      - name: Benchmark HD CPU and GPU
        run: |
          python integration/benchmark_effect_graph_gpu.py --backend egl --size hd --cpu --require-gpu --repeats 3 --output gpu-benchmark-hd.json
      - name: Benchmark M8.3 HD transition, channel, blur and bloom bridges
        run: |
          python integration/benchmark_effect_graph_m8_3_gpu.py --size hd --output m83-gpu-benchmark-hd.json
      - name: Benchmark M8.5 HD resident graph, transfers and CPU parity
        run: |
          python integration/benchmark_effect_graph_m8_5_gpu.py --size hd --cpu --repeats 2 --output m85-resident-gpu-hd.json
      - name: Benchmark M8.6 HD resident spectral bands and CPU parity
        run: |
          python integration/benchmark_effect_graph_m8_6_gpu.py --size hd --cpu --repeats 2 --output m86-resident-spectral-hd.json
      - name: Benchmark M8.7 resident matte/key with inherited alpha and CPU parity
        run: |
          python integration/benchmark_effect_graph_m8_7_gpu.py --size hd --cpu --repeats 2 --output m87-resident-matte-key-hd.json
      - name: Benchmark M8.8 mixed islands, decontamination and transfer telemetry
        run: |
          python integration/benchmark_effect_graph_m8_8_gpu.py --size hd --backend egl --repeats 2 --output m88-mixed-islands-hd.json
      - name: Benchmark M8.9 spatial warp HD CPU and GPU
        run: python integration/benchmark_effect_graph_m8_9_gpu.py --size hd --backend egl --output m89-spatial-hd.json
      - name: Benchmark M8.9 authored warp limits and nonperiodic polar seam
        run: python integration/benchmark_effect_graph_m8_9_precision.py --size hd --backend egl --output m89-spatial-precision-hd.json
      - name: Benchmark M8.9 resident target reuse and driver memory availability
        run: python integration/benchmark_effect_graph_m8_9_resources.py --size hd --backend egl --output m89-resources-hd.json
      - name: Optional GPU benchmark 4K and 8K
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmarks }}
        run: |
          python integration/benchmark_effect_graph_gpu.py --backend egl --all --gpu-budget-mib 1024 --require-gpu --repeats 2 --output gpu-benchmark-extended.json
          python integration/benchmark_effect_graph_spectral_gpu.py --size all --backend egl --allow-large --budget-mib 1024 --repeats 2 --output spectral-gpu-benchmark-extended.json
          python integration/benchmark_effect_graph_m8_5_gpu.py --size 4k --gpu-budget-mib 1024 --output m85-resident-gpu-4k.json
          python integration/benchmark_effect_graph_m8_5_gpu.py --size 8k --gpu-budget-mib 1024 --output m85-resident-gpu-8k.json
          python integration/benchmark_effect_graph_m8_6_gpu.py --size 4k --gpu-budget-mib 1024 --output m86-resident-spectral-4k.json
          python integration/benchmark_effect_graph_m8_6_gpu.py --size 8k --gpu-budget-mib 1024 --output m86-resident-spectral-8k.json
          python integration/benchmark_effect_graph_m8_7_gpu.py --size 4k --gpu-budget-mib 1024 --output m87-resident-matte-key-4k.json
          python integration/benchmark_effect_graph_m8_7_gpu.py --size 8k --gpu-budget-mib 1024 --output m87-resident-matte-key-8k.json
          python integration/benchmark_effect_graph_m8_9_resources.py --size 4k --backend egl --output m89-resources-4k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effect-graph-gpu-benchmarks
          path: |
            gpu-benchmark-*.json
            spectral-gpu-benchmark-*.json
            m83-gpu-benchmark-*.json
            m85-resident-gpu-*.json
            m86-resident-spectral-*.json
            m87-resident-matte-key-*.json
            m88-mixed-islands-*.json
            m89-spatial-*.json
            m89-resources-*.json
            gpu-transfer-results.xml
          if-no-files-found: ignore
