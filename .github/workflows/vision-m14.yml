name: M14 pinned CPU computer vision qualification
on:
  push:
    branches: [main]
    paths:
      - 'src/framerudiments/vision_m14*.py'
      - 'src/framerudiments/vision_graph_m14.py'
      - 'src/framerudiments/vision_batch_m14.py'
      - 'src/framerudiments/vision_provider_cache_m14.py'
      - 'src/framerudiments/vision_temporal_m14.py'
      - 'src/framerudiments/effect_graph_integration.py'
      - 'src/framerudiments/compositor.py'
      - 'src/framerudiments/project.py'
      - 'tests/test_vision_m14*.py'
      - 'tests/test_vision_graph*.py'
      - 'tests/test_vision_batch_m14*.py'
      - 'tests/test_vision_provider_cache_m14.py'
      - 'tests/test_vision_temporal_m14.py'
      - 'tests/test_vision_batch_windows_m14.py'
      - 'docs/vision-preview-m14-4.md'
      - 'integration/test_vision_batch*_m14_native.py'
      - 'integration/test_vision_provider_cache_gpu_m14_native.py'
      - 'docs/vision-inference-m14.md'
      - '.github/workflows/vision-m14.yml'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-inference:
    name: CPU ONNX (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install opt-in runtime and synthetic-model generator
        run: python -m pip install -e '.[dev,vision]' 'onnx>=1.17,<2'
      - name: Verify native ONNX Runtime CPU provider is installed
        run: python -c "import onnx, onnxruntime; assert 'CPUExecutionProvider' in onnxruntime.get_available_providers()"
      - name: Lint native inference implementation and tests
        run: ruff check src/framerudiments/vision_m14.py src/framerudiments/vision_m14_cli.py src/framerudiments/vision_graph_m14.py src/framerudiments/vision_batch_m14.py src/framerudiments/effect_graph_integration.py tests/test_vision_m14.py tests/test_vision_m14_real.py tests/test_vision_graph_m14.py tests/test_vision_graph_integration_m14.py tests/test_vision_graph_compositor_m14.py tests/test_vision_batch_m14.py tests/test_vision_provider_cache_m14.py tests/test_vision_temporal_m14.py integration/test_vision_batch_m14_native.py integration/test_vision_batch_gpu_m14_native.py integration/test_vision_provider_cache_gpu_m14_native.py src/framerudiments/vision_provider_cache_m14.py src/framerudiments/vision_temporal_m14.py tests/test_vision_batch_windows_m14.py
      - name: Exercise all three actual ONNX operators and isolated CPU worker
        run: python -m pytest -q -rs tests/test_vision_m14.py tests/test_vision_m14_real.py tests/test_vision_graph_m14.py tests/test_vision_graph_integration_m14.py tests/test_vision_graph_compositor_m14.py tests/test_vision_batch_m14.py tests/test_vision_provider_cache_m14.py tests/test_vision_temporal_m14.py integration/test_vision_batch_m14_native.py tests/test_vision_batch_windows_m14.py
      - name: No skipped native qualification cases
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-rs',
                                   'tests/test_vision_m14_real.py', 'integration/test_vision_batch_m14_native.py'],
                                   capture_output=True, text=True)
          print(result.stdout[-20000:])
          assert result.returncode == 0 and 'skipped' not in result.stdout.lower()
      - name: Python source distribution smoke
        run: python -m build
