name: Native preview stream qualification

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      gpu_size:
        description: 'Native GPU profile size (physical GPU approval remains separate)'
        type: choice
        options: [hd, uhd, small]
        default: hd
      preset:
        description: 'Bounded seek workload; stress includes 1000 random seeks'
        type: choice
        options: [standard, stress, smoke]
        default: standard

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  native-cpu:
    name: Native preview CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Probe owned temporary parent
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import tempfile; p=Path('.tmp'); p.mkdir(exist_ok=True); t=Path(tempfile.mkdtemp(dir=p)); f=t/'probe'; f.write_bytes(b'preview'); assert f.read_bytes()==b'preview'; f.rename(t/'renamed'); (t/'renamed').unlink(); t.rmdir()"
          if ($LASTEXITCODE -ne 0) { throw 'Temporary directory preflight failed.' }
      - run: python -m pip install -e '.[dev]'
      - name: Focused native profiling contract
        shell: pwsh
        run: |
          & ./scripts/Invoke-Tests.ps1 tests/test_preview_stream_profile.py -q --junitxml=preview-profile-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Native profile contract failed.' }
          python -c "import xml.etree.ElementTree as E; r=E.parse('preview-profile-tests.xml'); assert r.findall('.//testcase') and not r.findall('.//skipped')"
          if ($LASTEXITCODE -ne 0) { throw 'Native profiling checks must execute without skips.' }
      - name: Generate native seek and edit gallery
        run: >-
          python scripts/profile_preview_stream.py
          --output preview-qualification
          --preset smoke --size small --backend cpu
          --revision ${{ github.sha }} --max-seconds 180
      - name: Publish exact-source qualification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-cpu-${{ matrix.os }}-${{ github.sha }}
          path: |
            preview-qualification/qualification.json
            preview-qualification/index.html
            preview-profile-tests.xml
          if-no-files-found: error

  native-gpu:
    name: Native preview GPU graph (software EGL)
    runs-on: ubuntu-24.04
    # Keep the shared installer ceiling separate from the 15-minute GPU profile.
    timeout-minutes: 75
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '3.3'
      FRAMERUDIMENTS_GPU_BACKEND: egl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Probe owned temporary parent
        run: |
          python -c "from pathlib import Path; import tempfile; p=Path('.tmp'); p.mkdir(exist_ok=True); t=Path(tempfile.mkdtemp(dir=p)); f=t/'probe'; f.write_bytes(b'preview'); assert f.read_bytes()==b'preview'; f.rename(t/'renamed'); (t/'renamed').unlink(); t.rmdir()"
      - name: Native GPU dependencies
        timeout-minutes: 50
        run: bash scripts/install_ci_render_dependencies.sh --gpu
      - run: python -m pip install -e '.[dev,gpu]'
      - name: Generate strict native GPU seek and resource gallery
        run: >-
          python scripts/profile_preview_stream.py
          --output preview-qualification-gpu
          --preset ${{ inputs.preset || 'standard' }}
          --size ${{ inputs.gpu_size || 'hd' }} --backend gpu
          --revision ${{ github.sha }} --max-seconds 900
      - name: Require actual GPU dispatch and available-or-explicitly-unavailable memory evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('preview-qualification-gpu/qualification.json').read_text())
          assert report['status'] == 'passed'
          samples = [sample for case in report['native']['cases'] for sample in case['gpu']]
          assert samples, 'Strict GPU qualification produced no GPU samples'
          assert all(row['dispatch']['gpu_nodes'] > 0 and row['dispatch']['cpu_fallbacks'] == 0 for row in samples)
          assert all(row['driver_memory']['state'] in {'available', 'unavailable'} for row in samples)
          assert all(row['software_renderer'] for row in samples), 'This job qualifies software EGL only'
          assert not report['release_gates']['physical_gpu']
          PY
      - name: Publish exact-source GPU qualification artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-gpu-software-egl-${{ github.sha }}
          path: |
            preview-qualification-gpu/qualification.json
            preview-qualification-gpu/index.html
          if-no-files-found: error
