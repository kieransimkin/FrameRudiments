name: M15.3 owned OpenFX v1 Filter/RGBA8 qualification

on:
  push:
    branches: [main]
    paths:
      - 'src/framerudiments/openfx_*.py'
      - 'tests/test_openfx_m15.py'
      - 'tests/fixtures/openfx_m15/**'
      - 'integration/qualify_openfx_m15.py'
      - 'docs/openfx-m15.md'
      - 'docs/m15-integration-plan.md'
      - '.github/workflows/openfx-m15.yml'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata-and-process-contract:
    name: Admission and transaction tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src/framerudiments/openfx_m15.py src/framerudiments/openfx_m15_cli.py src/framerudiments/openfx_host_m15.py tests/test_openfx_m15.py integration/qualify_openfx_m15.py
      - name: Require no skips in metadata and transaction contracts
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1 -Python python -PytestArgs @('-q', 'tests/test_openfx_m15.py')

  native-reference-filter:
    name: Native C OFX, exact pixels and owned crash cleanup (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: gcc --version
      - name: Require real OpenFX entry points, suite calls and crash isolation
        run: python integration/qualify_openfx_m15.py --output openfx-qa
      - name: Validate output evidence and gallery
        run: |
          test -s openfx-qa/index.html
          test -s openfx-qa/qualification.json
          test "$(find openfx-qa -name 'reference-*.png' | wc -l)" -eq 4
          test "$(find openfx-qa -name 'source-*.png' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v6
        with:
          name: openfx-m15-3-${{ matrix.python }}-native-reference-evidence
          path: openfx-qa/
          if-no-files-found: error
