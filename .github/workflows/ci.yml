name: FrameRudiments CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-contract:
    name: Verified git-apply patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate and verify native Git diff against exact base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            base=$(git merge-base HEAD '${{ github.event.pull_request.base.sha }}')
          else
            base=$(git rev-parse HEAD^)
          fi
          git diff --binary "$base" HEAD --output="$RUNNER_TEMP/verified-change.patch"
          python scripts/validate_patch.py "$RUNNER_TEMP/verified-change.patch" \
            --base-ref "$base" --expected-sha "$base"
          git diff --check "$base" HEAD
      - name: Upload verified patch
        uses: actions/upload-artifact@v6
        with:
          name: verified-git-apply-patch
          path: ${{ runner.temp }}/verified-change.patch
  render-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Linux render dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/install_ci_render_dependencies.sh
          echo 'FRAMERUDIMENTS_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Windows render dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          "FRAMERUDIMENTS_TEST_FONT=C:\Windows\Fonts\arialbd.ttf" >> $env:GITHUB_ENV
          "FRAMERUDIMENTS_FFMPEG=$((Get-Command ffmpeg).Source)" >> $env:GITHUB_ENV
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Verify patch validation workflow contract
        run: python -m pytest -q tests/test_patch_validation.py
      # Spectral EGL tests run in required effect-graph-parity; keep the CPU no-skip gate strict.
      - run: python -m pytest -q --ignore=tests/test_effect_graph_gpu_parity.py --ignore=tests/test_effect_graph_gpu_spectral.py --junitxml=test-results.xml
      - name: No skipped rendering checks
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('test-results.xml'); assert not r.findall('.//skipped')"
      - run: python -m build
      - run: python -m twine check --strict dist/*

  effect-graph-parity:
    uses: ./.github/workflows/effect-graph-gpu.yml

  visualiser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Native and headless rendering dependencies
        run: |
          bash scripts/install_ci_render_dependencies.sh --gpu
          echo 'FRAMERUDIMENTS_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_BUTTERCHURN_RUNTIME=$RUNNER_TEMP/butterchurn" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[dev,projectm,gpu]'
      - name: Install checksum-pinned visual analysis releases
        run: python scripts/install_analysis_releases.py --with-sequence
      - run: framerudiments effects-setup butterchurn "$FRAMERUDIMENTS_BUTTERCHURN_RUNTIME"
      - run: framerudiments effects-setup projectm "$RUNNER_TEMP/projectm" --cmake-arg=-GNinja
      - name: Select exact pinned native library
        run: |
          echo "FRAMERUDIMENTS_PROJECTM_LIBRARY=$(find "$RUNNER_TEMP/projectm/install" -name 'libprojectM-4.so' -print -quit)" >> "$GITHUB_ENV"
      # The standalone ModernGL EGL tests passed, but a following GLFW/projectM
      # GLXMakeCurrent aborted Xlib with BadAccess in the same Python process.
      # Run both suites in separate interpreters and fresh Xvfb sessions.
      # This is isolation, not a skip, fallback or replacement for GPU testing.
      - name: Native OpenGL mesh, shadow and volume acceptance (isolated EGL session)
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -X faulthandler -m pytest -vv -s \
            integration/test_music_spatial_gpu.py \
            integration/test_fire_volume_gpu.py \
            --junitxml=gpu-mesh-results.xml 2>&1 | tee gpu-mesh-console.log
      - name: Butterchurn, projectM, profiling and encoded QA (fresh GLX session)
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python -X faulthandler -m pytest -vv -s \
            integration --ignore=integration/test_music_spatial_gpu.py --ignore=integration/test_fire_volume_gpu.py \
            --junitxml=gpu-results.xml 2>&1 | tee gpu-console.log
      - name: Verify both GPU suites ran without skipped tests
        run: |
          python - <<'PYTEST'
          import xml.etree.ElementTree as ET

          for name in ('gpu-mesh-results.xml', 'gpu-results.xml'):
              root = ET.parse(name).getroot()
              count = len(root.findall('.//testcase'))
              if not count:
                  raise SystemExit(f'{name}: no tests collected')
              if root.findall('.//skipped'):
                  raise SystemExit(f'{name}: GPU tests must not be skipped')
              print(f'{name}: {count} tests, none skipped')
          PYTEST
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visualiser-acceptance
          path: |
            gpu-mesh-results.xml
            gpu-mesh-console.log
            gpu-results.xml
            gpu-console.log
