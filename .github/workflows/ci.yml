name: FrameRudiments CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Linux render dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          echo 'FRAMERUDIMENTS_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Windows render dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          "FRAMERUDIMENTS_TEST_FONT=C:\Windows\Fonts\arialbd.ttf" >> $env:GITHUB_ENV
          "FRAMERUDIMENTS_FFMPEG=$((Get-Command ffmpeg).Source)" >> $env:GITHUB_ENV
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: No skipped rendering checks
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('test-results.xml'); assert not r.findall('.//skipped')"
      - run: python -m build
      - run: python -m twine check --strict dist/*

  visualiser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Native and headless rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core libgl1-mesa-dev libglfw3 xvfb xauth ninja-build
          echo 'FRAMERUDIMENTS_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "FRAMERUDIMENTS_BUTTERCHURN_RUNTIME=$RUNNER_TEMP/butterchurn" >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[dev,projectm]' numpy
      - name: Pinned released PrismMoves and PixelCue analysis APIs
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess, sys, urllib.request
          wheels = [
            ('https://github.com/kieransimkin/PrismMoves/releases/download/v0.1.0/prismmoves-0.1.0-py3-none-any.whl', '16b1ed8b8574809b36f7a1e60e5bd4fa2d024720b583106b73a5c3bf9e32f865'),
            ('https://github.com/kieransimkin/PixelCue/releases/download/v0.9.0/pixelcue-0.9.0-py3-none-any.whl', '9b89169331f002e93bcced0dcc62be340c6aa6d8bb87d35dc878fdfa755320d4')]
          for url, expected in wheels:
              data = urllib.request.urlopen(url, timeout=90).read()
              assert hashlib.sha256(data).hexdigest() == expected
              path = pathlib.Path(url.rsplit('/',1)[-1]); path.write_bytes(data)
              subprocess.run([sys.executable,'-m','pip','install','--no-deps',str(path)],check=True)
              path.unlink()
          PY
      - run: framerudiments effects-setup butterchurn "$FRAMERUDIMENTS_BUTTERCHURN_RUNTIME"
      - run: framerudiments effects-setup projectm "$RUNNER_TEMP/projectm" --cmake-arg=-GNinja
      - name: Select exact pinned native library
        run: |
          echo "FRAMERUDIMENTS_PROJECTM_LIBRARY=$(find "$RUNNER_TEMP/projectm/install" -name 'libprojectM-4.so' -print -quit)" >> "$GITHUB_ENV"
      - name: Actual engines, shaders, glyph feedback, animated sprites, chain and encoded QA
        run: xvfb-run -a python -m pytest -q integration --junitxml=gpu-results.xml
      - name: No skipped engine checks
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('gpu-results.xml'); assert not r.findall('.//skipped')"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visualiser-acceptance
          path: gpu-results.xml
