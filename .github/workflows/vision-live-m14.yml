name: M14.5 live vision preview and revision cancellation
on:
  push:
    branches: [main]
    paths:
      - 'src/framerudiments/vision_*.py'
      - 'src/framerudiments/preview_native_renderer.py'
      - 'src/framerudiments/preview_quality.py'
      - 'src/framerudiments/preview_stream_s2.py'
      - 'src/framerudiments/effect_graph_integration.py'
      - 'src/framerudiments/compositor.py'
      - 'tests/test_vision_live_m14.py'
      - 'authoring/src/StreamPreview.tsx'
      - 'docs/vision-live-m14-5.md'
      - '.github/workflows/vision-live-m14.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-vision:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install native CPU vision dependencies
        run: python -m pip install -e '.[dev,vision]' 'onnx>=1.17,<2'
      - name: Lint inference, graph bridge and preview changes
        run: >-
          ruff check src/framerudiments/vision_live_m14.py
          src/framerudiments/vision_m14.py src/framerudiments/vision_graph_m14.py
          src/framerudiments/effect_graph_integration.py src/framerudiments/compositor.py
          src/framerudiments/preview_native_renderer.py src/framerudiments/preview_quality.py
          src/framerudiments/preview_stream_s2.py tests/test_vision_live_m14.py
      - name: Verify live Q profiles, cancellation and existing vision contracts
        run: >-
          python -m pytest -q -rs tests/test_vision_live_m14.py
          tests/test_vision_temporal_m14.py tests/test_vision_graph_m14.py
          tests/test_vision_graph_integration_m14.py tests/test_vision_provider_cache_m14.py
          tests/test_preview_stream_s2.py tests/test_preview_refinement.py
      - name: Ensure no skipped new M14.5 acceptance checks
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '-rs',
                                   'tests/test_vision_live_m14.py'],
                                  capture_output=True, text=True)
          print(result.stdout)
          assert result.returncode == 0 and 'skipped' not in result.stdout.lower()
  browser-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install declared timeline version
        run: npm --prefix authoring install --no-audit --no-fund
      - name: Typecheck the actual preview UI
        run: npm --prefix authoring run typecheck
