name: M13 OpenTimelineIO exact-frame interoperability

on:
  push:
    branches: [main]
    paths:
      - 'src/framerudiments/timeline_otio*.py'
      - 'tests/test_timeline_otio*.py'
      - 'tests/test_m13_timeline_pages.py'
      - 'scripts/generate_m13_timeline_example.py'
      - 'scripts/generate_timeline_gallery_audio.py'
      - '.github/workflows/timeline-otio-m13.yml'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-otio:
    name: Real OTIO 0.18 / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install explicit native OTIO and test requirements
        run: python -m pip install -e '.[dev,timeline_otio]'
      - name: Require real OpenTimelineIO 0.18 bindings (no mocked or skipped decoder)
        run: python -c "import opentimelineio as o; assert hasattr(o.adapters, 'write_to_string') and hasattr(o.schema, 'Marker')"
      - name: Ruff M13 implementation, CLI and tests
        run: ruff check src/framerudiments/timeline_otio_m13.py src/framerudiments/timeline_otio_cli.py scripts/generate_m13_timeline_example.py tests/test_timeline_otio_m13.py tests/test_timeline_otio_real_m13.py tests/test_m13_timeline_pages.py
      - name: Exact frame interchange, invalid input and native adapter roundtrip
        run: python -m pytest -q -ra tests/test_timeline_otio_m13.py tests/test_timeline_otio_real_m13.py tests/test_m13_timeline_pages.py
      - name: Generate source-pinned OTIO and independent sample readback
        shell: bash
        run: |
          python scripts/generate_timeline_gallery_audio.py --output m13-evidence
          python scripts/generate_m13_timeline_example.py --site m13-evidence
          python scripts/generate_m13_timeline_example.py --verify m13-evidence
          framerudiments-timeline validate m13-evidence/example.timeline.json --verify-sources
          framerudiments-timeline import m13-evidence/example.otio --output m13-evidence/from-otio.json
          framerudiments-timeline validate m13-evidence/from-otio.json --verify-sources
      - name: Publish one portable synthetic interchange fixture
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        uses: actions/upload-artifact@v6
        with:
          name: framerudiments-m13-otio-evidence
          path: |
            m13-evidence/synthetic-click.wav
            m13-evidence/catalogue.json
            m13-evidence/example.timeline.json
            m13-evidence/example.otio
            m13-evidence/example.otio.receipt.json
            m13-evidence/from-otio.json
            m13-evidence/from-otio.json.receipt.json
          if-no-files-found: error
