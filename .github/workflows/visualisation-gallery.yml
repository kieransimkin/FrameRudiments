name: Visualisation gallery / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visualisation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install font for compositor effects tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          echo 'FRAMERUDIMENTS_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"
      - name: Install distribution and test tooling
        run: python -m pip install -e '.[dev]'
      - name: Validate all visualisation modes and deterministic output
        run: python -m pytest -q tests/test_advanced_renderers.py tests/test_visualisation_modulation.py tests/test_effect_batch.py tests/test_scoped_effects.py tests/test_sprite_renderers.py tests/test_quality_effects.py
      - name: Lint gallery and renderer implementation
        run: ruff check scripts/generate_visualisation_gallery.py src/framerudiments/advanced_renderers.py src/framerudiments/circular_renderers.py src/framerudiments/visualisation_catalogue.py src/framerudiments/visual_style.py src/framerudiments/modulation.py src/framerudiments/effect_catalogue.py src/framerudiments/effect_renderers.py src/framerudiments/post_effects.py src/framerudiments/scoped_effects.py scripts/generate_post_effect_gallery.py tests/test_advanced_renderers.py tests/test_visualisation_modulation.py tests/test_effect_batch.py tests/test_scoped_effects.py tests/test_sprite_renderers.py src/framerudiments/sprite_renderers.py src/framerudiments/sprite_catalogue.py scripts/generate_sprite_gallery.py scripts/build_sprite_assets.py src/framerudiments/quality_effects.py scripts/generate_quality_gallery.py tests/test_quality_effects.py
      - name: Render complete gallery from synthetic display fixtures
        run: python scripts/generate_visualisation_gallery.py --output _site
      - name: Generate isolated element and full-frame effects gallery
        run: python scripts/generate_post_effect_gallery.py --output _site
      - name: Generate high-quality anti-aliasing and motion-blur gallery
        run: python scripts/generate_quality_gallery.py --output _site
      - name: Generate sprite and vector comparison gallery
        run: python scripts/generate_sprite_gallery.py --output _site
      - name: Validate generated site and image count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('_site')
          data = json.loads((p / 'catalogue.json').read_text())
          assert data['synthetic_test_data'] and data['not_audio_measurements']
          assert len(data['views']) == 213
          assert len(data['style_lab']) == 20
          for item in data['style_lab']:
              assert item['native_drivers'] == ['circle', 'bounce']
              assert all((p / 'lab' / item['name'] / f'{i}.png').is_file() for i in range(len(data['frames'])))
          assert (p / 'index.html').is_file() and (p / '.nojekyll').exists()
          assert (p / 'scopes/index.html').is_file()
          assert (p / 'scopes/examples.json').is_file()
          assert len(list((p / 'scopes').glob('*/*.png'))) == 24
          quality = json.loads((p / 'quality/catalogue.json').read_text())
          assert quality['synthetic'] and not quality['measured_audio']
          assert len(quality['scenes']) >= 9 and len(quality['visualisers']) >= 4
          assert (p / 'quality/index.html').is_file()
          for scene in quality['scenes']:
              for j in range(len(quality['frames'])):
                  assert (p / 'quality' / scene['name'] / f'{j}.png').is_file()
          sprites = json.loads((p / 'sprites/catalogue.json').read_text())
          assert sprites['sprite_renderer_count'] == 52 and sprites['themes'] == 17
          assert len(list((p / 'sprites/themes').glob('*/*.png'))) == 136
          assert len(list((p / 'sprites/atlases').glob('*.png'))) == 17
          assert len(sprites['modulation_scenes']) == 16
          assert len(list((p / 'sprites/modulation').glob('*/*.png'))) == 64
          for row in data['views']:
              assert all((p / 'images' / row['name'] / f'{i}.png').is_file() for i in range(len(data['frames'])))
          PY
      - name: Upload portable gallery for pull requests and main
        uses: actions/upload-artifact@v6
        with:
          name: framerudiments-visualisation-gallery
          path: _site/
      - name: Package Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: [build-gallery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
