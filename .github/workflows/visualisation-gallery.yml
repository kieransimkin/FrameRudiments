name: Visualisation gallery / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visualisation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install font for compositor effects tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          echo 'FRAMERUDIMENTS_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' >> "$GITHUB_ENV"
      - name: Install distribution and test tooling
        run: python -m pip install -e '.[dev]'
      - name: Validate all visualisation modes and deterministic output
        run: python -m pytest -q tests/test_advanced_renderers.py tests/test_visualisation_modulation.py tests/test_effect_batch.py tests/test_scoped_effects.py tests/test_sprite_renderers.py tests/test_quality_effects.py tests/test_particle_engine.py tests/test_variable_bpm_words.py tests/test_rich_subtitles.py tests/test_default_antialias.py tests/test_supersampling.py tests/test_visualiser_routing.py
      - name: Validate renderer cross-quality and stateful scene contracts
        run: python -m pytest -q tests/test_coverage_matrix.py
      - name: Validate native stem aliases and track mattes
        run: python -m pytest -q tests/test_layer_masks.py tests/test_stem_source_integration.py tests/test_stem_blend.py
      - name: Verify deterministic keyframed mattes
        run: python -m pytest -q tests/test_keyframes.py
      - name: Validate Phase 3 animation and displacement
        run: python -m pytest -q tests/test_phase3_animation.py tests/test_phase3_gpu_injection.py
      - name: Check deterministic 3D perspective renderers
        run: python -m pytest -q tests/test_spatial_renderers.py
      - name: Lint gallery and renderer implementation
        run: ruff check src/framerudiments/beat_timeline.py src/framerudiments/word_timing.py tests/test_variable_bpm_words.py scripts/generate_timing_gallery.py scripts/generate_visualisation_gallery.py src/framerudiments/advanced_renderers.py src/framerudiments/circular_renderers.py src/framerudiments/visualisation_catalogue.py src/framerudiments/visual_style.py src/framerudiments/modulation.py src/framerudiments/effect_catalogue.py src/framerudiments/effect_renderers.py src/framerudiments/post_effects.py src/framerudiments/scoped_effects.py scripts/generate_post_effect_gallery.py tests/test_advanced_renderers.py tests/test_visualisation_modulation.py tests/test_effect_batch.py tests/test_scoped_effects.py tests/test_sprite_renderers.py src/framerudiments/sprite_renderers.py src/framerudiments/sprite_catalogue.py scripts/generate_sprite_gallery.py scripts/build_sprite_assets.py src/framerudiments/quality_effects.py scripts/generate_quality_gallery.py tests/test_quality_effects.py src/framerudiments/particle_engine.py scripts/generate_particle_gallery.py tests/test_particle_engine.py src/framerudiments/rich_subtitles.py src/framerudiments/lyric_indicator.py scripts/generate_rich_lyric_gallery.py tests/test_rich_subtitles.py src/framerudiments/output_quality.py src/framerudiments/super_sampling.py tests/test_default_antialias.py tests/test_supersampling.py scripts/generate_supersampling_gallery.py src/framerudiments/visualiser_routing.py tests/test_visualiser_routing.py scripts/generate_visualiser_routing_gallery.py
      - name: Render complete gallery from synthetic display fixtures
        run: python scripts/generate_visualisation_gallery.py --output _site
      - name: Record non-blocking renderer quality and memory profiles
        run: python scripts/profile_visualisation_coverage.py --output _site/coverage-profile.json
      - name: Generate isolated element and full-frame effects gallery
        run: python scripts/generate_post_effect_gallery.py --output _site
      - name: Generate high-quality anti-aliasing and motion-blur gallery
        run: python scripts/generate_quality_gallery.py --output _site
      - name: Generate sprite and vector comparison gallery
        run: python scripts/generate_sprite_gallery.py --output _site
      - name: Generate particles and smoke gallery
        run: python scripts/generate_particle_gallery.py --output _site
      - name: Generate variable-tempo and word-timing gallery
        run: python scripts/generate_timing_gallery.py --output _site
      - name: Generate rich lyrics and word-indicator gallery
        run: python scripts/generate_rich_lyric_gallery.py --output _site
      - name: Generate source-level supersampling gallery
        run: python scripts/generate_supersampling_gallery.py --output _site
      - name: Generate Butterchurn/projectM layer-routing demonstrations
        run: python scripts/generate_visualiser_routing_gallery.py --output _site
      - name: Validate generated site and image count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('_site')
          data = json.loads((p / 'catalogue.json').read_text())
          assert data['synthetic_test_data'] and data['not_audio_measurements']
          assert len(data['views']) == 213
          assert len(data['style_lab']) == 20
          for item in data['style_lab']:
              assert item['native_drivers'] == ['circle', 'bounce']
              assert all((p / 'lab' / item['name'] / f'{i}.png').is_file() for i in range(len(data['frames'])))
          assert (p / 'index.html').is_file() and (p / '.nojekyll').exists()
          assert (p / 'scopes/index.html').is_file()
          assert (p / 'scopes/examples.json').is_file()
          assert len(list((p / 'scopes').glob('*/*.png'))) == 24
          supersampling = json.loads((p / 'supersampling/catalogue.json').read_text())
          assert supersampling['synthetic'] and not supersampling['measured_audio']
          assert len(supersampling['scenes']) == 8 and len(supersampling['frames']) == 4
          assert supersampling['default']['spatial_scale'] == 4
          assert supersampling['default']['temporal_samples'] == 8
          assert (p / 'supersampling/index.html').is_file()
          assert len(list((p / 'supersampling').glob('*/*.png'))) == 32
          quality = json.loads((p / 'quality/catalogue.json').read_text())
          assert quality['synthetic'] and not quality['measured_audio']
          assert len(quality['scenes']) >= 11 and len(quality['visualisers']) >= 4
          assert quality['default_render_quality']['enabled'] is True
          assert {'default-aa', 'default-off'} <= {s['name'] for s in quality['scenes']}
          assert (p / 'quality/index.html').is_file()
          for scene in quality['scenes']:
              for j in range(len(quality['frames'])):
                  assert (p / 'quality' / scene['name'] / f'{j}.png').is_file()
          particles = json.loads((p / 'particles/catalogue.json').read_text())
          assert particles['synthetic'] and not particles['measured_audio']
          assert len(particles['scenes']) == 12 and len(particles['frames']) == 4
          assert (p / 'particles/index.html').is_file()
          assert len(list((p / 'particles').glob('*/*.png'))) == 48
          timing = json.loads((p / 'timing/catalogue.json').read_text())
          assert timing['synthetic'] and len(timing['scenes']) == 4
          assert (p / 'timing/index.html').is_file()
          assert len(list((p / 'timing').glob('*/*.png'))) == 16
          rich = json.loads((p / 'rich-lyrics/catalogue.json').read_text())
          assert rich['synthetic'] and len(rich['scenes']) == 8 and len(rich['frames']) == 4
          assert (p / 'rich-lyrics/index.html').is_file()
          assert len(list((p / 'rich-lyrics').glob('*/*.png'))) == 32
          routing = json.loads((p / 'routing/catalogue.json').read_text())
          assert routing['synthetic'] and routing['real_gpu_render'] is False
          assert len(routing['scenes']) == 12 and len(routing['frames']) == 5
          assert (p / 'routing/index.html').is_file()
          assert len(list((p / 'routing').glob('*/*.png'))) == 60
          sprites = json.loads((p / 'sprites/catalogue.json').read_text())
          assert sprites['sprite_renderer_count'] == 52 and sprites['themes'] == 17
          assert len(list((p / 'sprites/themes').glob('*/*.png'))) == 136
          assert len(list((p / 'sprites/atlases').glob('*.png'))) == 17
          assert len(sprites['modulation_scenes']) == 16
          assert len(list((p / 'sprites/modulation').glob('*/*.png'))) == 64
          for row in data['views']:
              assert all((p / 'images' / row['name'] / f'{i}.png').is_file() for i in range(len(data['frames'])))
          PY
      - name: Upload portable gallery for pull requests and main
        uses: actions/upload-artifact@v6
        with:
          name: framerudiments-visualisation-gallery
          path: _site/
      - name: Package Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: [build-gallery]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
