[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framerudiments"
version = "0.4.2"
description = "Deterministic Shorts and lyric visualisers using DanceRudiments and StemLab evidence."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Kieran Simkin"}]
dependencies = ["Pillow>=10", "dancerudiments>=0.3.0,<0.4"]

[project.optional-dependencies]
projectm = ["glfw==2.10.2", "PyOpenGL==3.1.10"]
gpu = ["moderngl>=5.11,<6", "numpy>=1.26"]
materials = ["numpy>=1.26"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9", "twine>=6", "numpy>=1.26"]

[project.urls]
Homepage = "https://kieransimkin.co.uk/danceflow/"
Repository = "https://github.com/kieransimkin/FrameRudiments"
Issues = "https://github.com/kieransimkin/FrameRudiments/issues"
Documentation = "https://github.com/kieransimkin/FrameRudiments#readme"

[project.scripts]
framerudiments = "framerudiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
framerudiments = ["visualiser_assets/*", "sprite_assets/*.png", "sprite_assets/*.json", "fire_assets/*/*.png", "fire_assets/*/*.json", "fire_assets/*/*.md"]
