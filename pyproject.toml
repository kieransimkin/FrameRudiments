[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framerudiments"
version = "0.4.34"
description = "Deterministic Shorts and lyric visualisers using DanceRudiments and StemLab evidence."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Kieran Simkin"}]
dependencies = ["Pillow>=10", "dancerudiments>=0.3.0,<0.4"]

[project.optional-dependencies]
projectm = ["glfw==2.10.2", "PyOpenGL==3.1.10", "numpy>=1.26"]
gpu = ["moderngl>=5.11,<6", "numpy>=1.26"]
materials = ["numpy>=1.26"]
effect_graph = ["numpy>=1.26"]
colour_aov = ["numpy>=1.26", "OpenEXR>=3.4.16,<4", "opencolorio>=2.5,<3"]
timeline_otio = ["opentimelineio>=0.18.0,<0.19"]
vision = ["numpy>=1.26", "onnxruntime>=1.20,<2"]
openusd = ["usd-core>=26.11,<27", "numpy>=1.26"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9", "twine>=6", "numpy>=1.26"]

[project.urls]
Homepage = "https://kieransimkin.co.uk/danceflow/"
Repository = "https://github.com/kieransimkin/FrameRudiments"
Issues = "https://github.com/kieransimkin/FrameRudiments/issues"
Documentation = "https://github.com/kieransimkin/FrameRudiments#readme"

[project.scripts]
framerudiments = "framerudiments.cli:main"
framerudiments-colour = "framerudiments.colour_aov_cli:main"
framerudiments-timeline = "framerudiments.timeline_otio_cli:main"
framerudiments-gstreamer = "framerudiments.gstreamer_m15_cli:main"
framerudiments-openfx = "framerudiments.openfx_m15_cli:main"
framerudiments-usd = "framerudiments.usd_m15_cli:main"
framerudiments-vision = "framerudiments.vision_m14_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
framerudiments = ["visualiser_assets/*", "sprite_assets/*.png", "sprite_assets/*.json", "fire_assets/*/*.png", "fire_assets/*/*.json", "fire_assets/*/*.md"]
