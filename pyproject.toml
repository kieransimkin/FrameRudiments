[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framerudiments"
version = "0.1.0"
description = "Deterministic Shorts and lyric visualisers using DanceRudiments and StemLab evidence."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Kieran Simkin"}]
dependencies = ["Pillow>=10", "dancerudiments>=0.3.0,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9"]

[project.urls]
Homepage = "https://kieransimkin.co.uk/danceflow/"

[project.scripts]
framerudiments = "framerudiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
