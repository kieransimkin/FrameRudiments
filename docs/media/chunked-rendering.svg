<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FrameRudiments sequential chunk rendering</title>
  <desc id="desc">A song timeline splits near verse and chorus cues, renders finalized video chunks sequentially, then stream-copy joins them and muxes audio once before full QA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#170525"/><stop offset="1" stop-color="#4b1238"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffb52e"/><stop offset=".5" stop-color="#fff0a0"/><stop offset="1" stop-color="#f46b1a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif" fill="#fff7dc">
    <text x="60" y="64" font-size="30" font-weight="700">Music-aware, resumable long render</text>
    <text x="60" y="100" font-size="17" fill="#e8cfe8">One absolute frame clock • sequential state • audio muxed once</text>
  </g>
  <g transform="translate(60 155)">
    <rect width="1080" height="72" rx="18" fill="#290a3f" stroke="#b878c4" stroke-width="2"/>
    <rect x="10" y="10" width="330" height="52" rx="12" fill="#6a224f"/>
    <rect x="350" y="10" width="350" height="52" rx="12" fill="#85313f"/>
    <rect x="710" y="10" width="360" height="52" rx="12" fill="#5d245f"/>
    <g fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
      <text x="140" y="43">Verse</text><text x="490" y="43">Chorus</text><text x="850" y="43">Interlude</text>
    </g>
    <g stroke="url(#gold)" stroke-width="4" filter="url(#glow)"><line x1="345" y1="-18" x2="345" y2="88"/><line x1="705" y1="-18" x2="705" y2="88"/></g>
    <g fill="#ffd866" font-family="system-ui, sans-serif" font-size="14"><text x="280" y="-27">structural cue</text><text x="642" y="-27">structural cue</text></g>
  </g>
  <g transform="translate(60 300)" font-family="system-ui, sans-serif">
    <g><rect width="250" height="100" rx="18" fill="#35104d" stroke="#ffbb38" stroke-width="2"/><text x="125" y="43" fill="#fff" font-size="19" text-anchor="middle">Render chunk 1</text><text x="125" y="70" fill="#e8cfe8" font-size="14" text-anchor="middle">full decode + receipt</text></g>
    <path d="M260 50h70" stroke="#ffcf60" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(340)"><rect width="250" height="100" rx="18" fill="#35104d" stroke="#ffbb38" stroke-width="2"/><text x="125" y="43" fill="#fff" font-size="19" text-anchor="middle">Replay then chunk 2</text><text x="125" y="70" fill="#e8cfe8" font-size="14" text-anchor="middle">feedback state restored</text></g>
    <path d="M600 50h70" stroke="#ffcf60" stroke-width="5"/>
    <g transform="translate(680)"><rect width="190" height="100" rx="18" fill="#35104d" stroke="#ffbb38" stroke-width="2"/><text x="95" y="43" fill="#fff" font-size="19" text-anchor="middle">Stream-copy join</text><text x="95" y="70" fill="#e8cfe8" font-size="14" text-anchor="middle">audio once</text></g>
    <path d="M880 50h70" stroke="#ffcf60" stroke-width="5"/>
    <g transform="translate(960)"><rect width="120" height="100" rx="18" fill="#78313d" stroke="#fff0a0" stroke-width="2"/><text x="60" y="38" fill="#fff" font-size="17" text-anchor="middle">Final QA</text><text x="60" y="63" fill="#fff0a0" font-size="13" text-anchor="middle">seams</text><text x="60" y="82" fill="#fff0a0" font-size="13" text-anchor="middle">decode • hash</text></g>
  </g>
  <text x="60" y="462" fill="#e8cfe8" font-family="system-ui, sans-serif" font-size="16">Generated architecture illustration — no private campaign media</text>
</svg>
